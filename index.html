<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PrepFuel" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/styles.css" />
  <title>PrepFuel</title>
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-go="home" aria-label="PrepFuel home">
        <div class="logo-mark">PF</div>
        <div class="brand-copy">
          <div class="brand">PREP<span>FUEL</span></div>
          <div class="subtitle">ATHLETE MEAL SYSTEM</div>
        </div>
      </button>
      <button id="syncBtn" class="icon-btn" aria-label="Sync recipes" title="Sync recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 8.2A7 7 0 0 1 18.6 6L20 7M4 17l1.4 1A7 7 0 0 0 17.9 15.8"/></svg>
      </button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" id="nav" aria-label="Main navigation">
      <button data-tab="home"><span>⌂</span><small>Home</small></button>
      <button data-tab="recipes"><span>▦</span><small>Meals</small></button>
      <button data-tab="grocery"><span>✓</span><small>Grocery</small></button>
      <button data-tab="budget"><span>◫</span><small>Budget</small></button>
      <button data-tab="settings"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="assets/app.js"></script>
</body>
</html>
