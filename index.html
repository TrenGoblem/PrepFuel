<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PrepFuel" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/styles.css" />
  <title>PrepFuel</title>
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-go="home" aria-label="PrepFuel home">
        <div class="logo-mark" aria-hidden="true">
    <svg viewBox="0 0 48 48">
      <path class="mark-p" d="M8 36 14.5 11H27c5.2 0 8.9 1.2 11.2 3.6 2.1 2.2 2.8 5.1 2 8.6-1.2 5.2-5.7 8.8-12.2 8.8h-8.2L18.7 36H8Zm13-12h6.4c2.3 0 3.8-.9 4.2-2.8.4-1.8-.7-2.7-3.2-2.7h-5.9L21 24Z"/>
      <path class="mark-f" d="M25.5 11H42l-1.7 7H32l-.9 3.8h7.4l-1.6 6.5h-7.4L27.5 36H18z"/>
    </svg>
  </div>
        <div class="brand-copy">
          <div class="brand">PREP<span>FUEL</span></div>
          <div class="subtitle">ATHLETE MEAL SYSTEM</div>
        </div>
      </button>
      <button id="syncBtn" class="icon-btn" aria-label="Sync recipes" title="Sync recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 8.2A7 7 0 0 1 18.6 6L20 7M4 17l1.4 1A7 7 0 0 0 17.9 15.8"/></svg>
      </button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" id="nav" aria-label="Main navigation">
      <button data-tab="home" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 10.4 12 4l8 6.4V20a1 1 0 0 1-1 1h-4.6v-6h-4.8v6H5a1 1 0 0 1-1-1v-9.6Z"/></svg></span><small>Home</small>
      </button>
      <button data-tab="recipes" aria-label="Meals">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><small>Meals</small>
      </button>
      <button data-tab="prep" aria-label="Prep">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="m7.5 10 2 2 4-4M7.5 16H16"/></svg></span><small>Prep</small>
      </button>
      <button data-tab="grocery" aria-label="Grocery">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h2l2.1 9.1a2 2 0 0 0 2 1.5h6.9a2 2 0 0 0 1.9-1.4L20 9H7.1"/><path d="M10 20h.01M17 20h.01"/></svg></span><small>Grocery</small>
      </button>
      <button data-tab="budget" aria-label="Budget">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16v11H4z"/><path d="M4 10h16M8 15h3"/></svg></span><small>Budget</small>
      </button>
      <button data-tab="settings" aria-label="Settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 15.3a3.3 3.3 0 1 0 0-6.6 3.3 3.3 0 0 0 0 6.6Z"/><path d="M19.4 15a7.9 7.9 0 0 0 .1-6l-2.2.1-1.1-1.9 1-2A8 8 0 0 0 12 3l-1.1 2-2.2.1-1.2-1.9A8 8 0 0 0 4.3 7l1.2 1.8-1.1 1.9-2.2.2A8 8 0 0 0 2.1 15l2.2.1 1.1 1.9-1 2A8 8 0 0 0 9.6 21l1.1-2 2.2-.1 1.2 1.9a8 8 0 0 0 3.2-3.8l-1.2-1.8 1.1-1.9 2.2-.3Z"/></svg></span><small>Settings</small>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="assets/app.js"></script>
</body>
</html>
