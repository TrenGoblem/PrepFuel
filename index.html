<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fuelr" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/styles.css" />
  <title>Fuelr</title>
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-go="home" aria-label="Fuelr home">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><text x="24" y="30" text-anchor="middle">FR</text></svg>
        </div>
        <div class="brand-copy">
          <div class="brand">FUEL<span>R</span></div>
          <div class="subtitle">PERSONAL MEAL SYSTEM</div>
        </div>
      </button>
      <button id="syncBtn" class="icon-btn" aria-label="Sync recipes" title="Sync recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 8.2A7 7 0 0 1 18.6 6L20 7M4 17l1.4 1A7 7 0 0 0 17.9 15.8"/></svg>
      </button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav detailed-nav" id="nav" aria-label="Main navigation">
      <button data-tab="home" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 10.4 12 4l8 6.4V20a1 1 0 0 1-1 1h-4.6v-6h-4.8v6H5a1 1 0 0 1-1-1v-9.6Z"/></svg></span><small>Home</small>
      </button>
      <button data-tab="recipes" aria-label="Meals">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><small>Meals</small>
      </button>
      <button data-tab="prep" aria-label="Prep">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 7h14v13H5zM8 4h8v3H8z"/><path d="M8 11h8M8 15h5"/></svg></span><small>Prep</small>
      </button>
      <button data-tab="grocery" aria-label="Grocery">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h9l2-7H8"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg></span><small>Grocery</small>
      </button>
      <button data-tab="calendar" aria-label="Calendar">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="M8 12h3v3H8zM13 12h3v3h-3zM8 17h3v2H8zM13 17h3v2h-3z"/></svg></span><small>Calendar</small>
      </button>
      <button data-tab="budget" aria-label="Budget">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM7 4h10v3H7z"/><path d="M8 13h8M12 10v6"/></svg></span><small>Budget</small>
      </button>
      <button data-tab="settings" aria-label="Settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7L10.5 2h-3l-.7 2-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2h3l.7-2 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7z"/></svg></span><small>Settings</small>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/cloud-config.js"></script>
  <script src="assets/cloud.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
