<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fuelr" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/styles.css" />
  <title>Fuelr</title>
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-go="home" aria-label="Fuelr home">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><text x="24" y="30" text-anchor="middle">FR</text></svg>
        </div>
        <div class="brand-copy">
          <div class="brand">FUEL<span>R</span></div>
          <div class="subtitle">PERSONAL MEAL SYSTEM</div>
        </div>
      </button>
      <button id="syncBtn" class="icon-btn" aria-label="Sync recipes" title="Sync recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 8.2A7 7 0 0 1 18.6 6L20 7M4 17l1.4 1A7 7 0 0 0 17.9 15.8"/></svg>
      </button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" id="nav" aria-label="Main navigation">
      <button data-tab="home" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 10.4 12 4l8 6.4V20a1 1 0 0 1-1 1h-4.6v-6h-4.8v6H5a1 1 0 0 1-1-1v-9.6Z"/></svg></span><small>Home</small>
      </button>
      <button data-tab="recipes" aria-label="Meals">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><small>Meals</small>
      </button>
      <button data-tab="week" aria-label="Week">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="m8 14 2 2 5-5"/></svg></span><small>Week</small>
      </button>
      <button data-tab="calendar" aria-label="Calendar">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="M8 12h3v3H8zM13 12h3v3h-3zM8 17h3v2H8zM13 17h3v2h-3z"/></svg></span><small>Calendar</small>
      </button>
      <button data-tab="you" aria-label="You">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><small>You</small>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/cloud-config.js"></script>
  <script src="assets/cloud.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
